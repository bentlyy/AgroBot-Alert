services:
  mysql:
    image: mysql:8.0
    container_name: agrobot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-agro5}
      MYSQL_USER: ${DB_USER:-agro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root123}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    container_name: agrobot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-agro}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-agro5}
      PORT: "3000"
      USE_MOCK_API: "true"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://agrobot.amgdeveloper.cl
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-14155238886}
      TWILIO_WHATSAPP_TO: ${TWILIO_WHATSAPP_TO:-}
      EMAIL_USER: ${EMAIL_USER:-amgdevelpments@gmail.com}
      EMAIL_PASS: "${EMAIL_PASS:-}"
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: agrobot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
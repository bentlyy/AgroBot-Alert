services:
  mysql:
    image: mysql:8.0
    container_name: agrobot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agro5
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot123", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: agrobot-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: agro5
      DB_PORT: "3306"
      PORT: "3000"
      USE_MOCK_API: "true"
      JWT_SECRET: agrobot_dev_secret_change_in_production
      FRONTEND_URL: http://localhost:5173
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-14155238886}
      TWILIO_WHATSAPP_TO: ${TWILIO_WHATSAPP_TO:-}
      EMAIL_USER: ${EMAIL_USER:-amgdevelpments@gmail.com}
      EMAIL_PASS: "${EMAIL_PASS:-}"
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: agrobot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
